services:
  postgres:
    image: postgres:16
    container_name: sunny-side-up-postgres


  environment:
    POSTGRES_DB: sunnysideupdb
    POSTGRES_USER: sunnyuser
    POSTGRES_PASSWORD: sunnydummypassword

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data



volumes:
  postgres-data: